name: Bug report
description: Something broke, or the numbers look wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got. Paste tracebacks in full.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `contextrot doctor`
      description: >
        Shows your version, which agents were found and where contextrot looked. It answers
        most "why don't I have a verdict" questions on its own, so please run it first.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
  - type: textarea
    id: transcript
    attributes:
      label: Sanitized transcript snippet (parsing bugs only)
      description: >
        If parsing failed, paste the offending JSONL line(s) with file paths, code and personal
        data replaced by placeholders. Never paste raw transcript content.
