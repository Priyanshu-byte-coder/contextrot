name: Share your curve
description: Add your results to the community dataset. Clean curves count as much as rotten ones.
title: "Curve: "
labels: [share-your-curve]
body:
  - type: markdown
    attributes:
      value: |
        Every claim about context rot so far comes from lab benchmarks. Real coding work across
        many people is the dataset nobody has — yours helps build it.

        **Run this, then paste what it prints below:**

        ```
        contextrot share --copy
        ```

        It contains aggregate numbers only: your verdict, failure rates and step counts per
        context-fill bucket, and which factors moved your rate. **No project names, file paths,
        prompts, code, timestamps or costs** — and contextrot sent nothing anywhere to make it.
        Read it before you paste; every line is yours to check.
  - type: textarea
    id: curve
    attributes:
      label: Output of `contextrot share`
      description: Paste the whole JSON block.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything surprising? (optional)
      description: >
        A model that held up better than you expected, a factor you didn't see coming,
        how you usually work (long sessions, lots of /clear, subagents…).
