[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextrot"
version = "2.0.0"
description = "Does your coding agent get worse as its context fills? Measure it on your own sessions — and find what actually moves its failure rate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Priyanshu Doshi" }]
keywords = [
    "llm",
    "claude-code",
    "codex",
    "gemini-cli",
    "coding-agents",
    "context-engineering",
    "context-rot",
    "context-window",
    "agents",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/Priyanshu-byte-coder/contextrot"
Repository = "https://github.com/Priyanshu-byte-coder/contextrot"
Issues = "https://github.com/Priyanshu-byte-coder/contextrot/issues"

[project.scripts]
contextrot = "contextrot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextrot"]

# The source distribution is for building and testing the package, so it keeps
# src/ and tests/ and drops what only the GitHub page needs. The README's images
# use absolute URLs, so PyPI renders them without the files being in the sdist —
# and the showcase media alone was most of a 7 MB download.
[tool.hatch.build.targets.sdist]
exclude = ["/assets", "/scripts", "/.github", "/npm", "/site"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
